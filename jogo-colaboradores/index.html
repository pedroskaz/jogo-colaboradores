<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seja um colaborador</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EEFA;--ink:#3A3752;--mut:#8A86A3;--lav:#D9D2F2;--mint:#C6EBDA;--peach:#FFD6C2;--sky:#E6F0FB;--btn:#06b6d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito','Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:18px 14px}
main{width:100%;max-width:420px}
h1{font-size:24px;margin:4px 0 14px;text-align:center}
.abas{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-bottom:14px}
.abas button{height:54px;border:0;border-radius:18px;font:800 17px inherit;font-family:inherit;color:var(--ink);background:var(--lav);cursor:pointer}
.abas button#aba-rank{background:var(--peach)}
.abas button.on{outline:3px solid var(--ink)}
.painel{display:none}.painel.on{display:block}
.cena{position:relative;border-radius:22px;overflow:hidden;background:var(--sky)}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
#dica{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;pointer-events:none}
.card{background:#fff;border-radius:22px;padding:18px;margin-top:12px;text-align:center}
.card input{width:100%;height:48px;border:2px solid var(--lav);border-radius:14px;padding:0 14px;font:700 17px inherit;font-family:inherit;margin:10px 0;text-align:center}
.card button{height:48px;width:100%;border:0;border-radius:14px;background:var(--mint);font:800 17px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;padding:12px 14px;margin-bottom:8px;background:#fff;border-radius:16px;font-weight:800}
li b{width:28px;color:var(--mut)}li span{margin-left:auto}li.eu{background:var(--mint)}
li:nth-child(-n+3) b{color:#E59A6F}
.vazio{text-align:center;color:var(--mut);font-weight:600}
#entrada{position:fixed;inset:0;z-index:10;background:rgba(10,8,22,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#entrada.sai{opacity:0;pointer-events:none}
#entrada img{width:150px;height:150px;object-fit:contain}
#btn-colab{height:84px;padding:0 56px;border:0;border-radius:42px;background:var(--btn);color:#fff;font:800 28px inherit;font-family:inherit;cursor:pointer;box-shadow:0 6px 20px rgba(6,182,212,.45)}
#pose{animation:salta 1s ease-in-out infinite}
@keyframes salta{50%{transform:translateY(-12px)}}
#fim{position:fixed;inset:0;z-index:5;background:rgba(40,36,70,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;animation:pop .35s ease-out}
#fim[hidden]{display:none}
#triste{width:96px;height:98px}
#fim h2{margin:0;font-size:34px}
#fim p{margin:0 0 6px;font-size:19px}
#fim b{font-size:30px;color:var(--mint)}
#fim input{width:100%;max-width:340px;height:62px;border:3px solid var(--mint);border-radius:18px;font:800 24px inherit;font-family:inherit;text-align:center;color:var(--ink);animation:brilha 1.4s infinite}
#fim button{width:100%;max-width:340px;height:58px;border:0;border-radius:18px;background:var(--mint);color:var(--ink);font:800 21px inherit;font-family:inherit;cursor:pointer}
#erro{min-height:20px;color:#ffd6c2;font-weight:600}
@keyframes pop{from{transform:scale(.88);opacity:0}}
@keyframes brilha{50%{box-shadow:0 0 0 7px rgba(198,235,218,.55)}}
.insta{display:flex;gap:12px;margin-top:22px;align-items:flex-end}
.insta .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.insta small{font-size:12px;font-weight:700;color:var(--mut);line-height:1.25}
.insta a{display:inline-block;padding:7px 20px;border-radius:999px;font-family:inherit;font-weight:800;font-size:14px;text-decoration:none}
.insta .b{background:#FFE98A;color:#5A4600;border:2px solid #F2C94C}
.insta .a{background:#4B2A7B;color:#EADCFF;border:2px solid #7A4BC2}
</style>
</head>
<body>
<div id="entrada">
  <canvas id="pose" width="190" height="200"></canvas>
  <button id="btn-colab">Ser colaborador</button>
</div>

<main>
  <h1>Colaboradores da lixeira</h1>
  <nav class="abas">
    <button id="aba-jogo" class="on">Jogo</button>
    <button id="aba-rank">Colaboradores</button>
  </nav>

  <section id="painel-jogo" class="painel on">
    <div class="cena" id="cena">
      <canvas id="cv"></canvas>
      <div id="dica">Toque para começar</div>
    </div>
    <p class="vazio">Toque na tela para pular. Desvie das pessoas e pegue o lixo.</p>
    <div id="fim" hidden>
      <canvas id="triste" width="96" height="98"></canvas>
      <h2>Fim de jogo!</h2>
      <p>Você coletou <b id="fim-pts">0</b> lixos</p>
      <input id="nome" maxlength="12" placeholder="Digite seu apelido" autocomplete="off">
      <button id="salvar">Salvar no ranking</button>
      <div id="erro"></div>
    </div>
    <div id="jogado" class="card" hidden></div>
  </section>

  <section id="painel-rank" class="painel">
    <ol id="lista"></ol>
    <div id="meu" class="card" hidden></div>
    <div class="insta">
      <div class="col">
        <small>↓ Siga nossa sala no insta! ↓</small>
        <a class="b" href="https://www.instagram.com/chum.info1b?srtk=ZnIxbnI5Y3ZzN2xo" target="_blank" rel="noopener">Info 1 B</a>
      </div>
      <div class="col">
        <small>↓ Siga o insta dos nossos colegas! ↓</small>
        <a class="a" href="https://www.instagram.com/chum_info1a?exln=MWx2d2Z3ZjRhM2hyNw==" target="_blank" rel="noopener">Info 1 A</a>
      </div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const API = '/api/ranking';
let colab = null;
try { colab = JSON.parse(localStorage.getItem('colab2') || 'null'); } catch (e) {}
function guardar() { try { localStorage.setItem('colab2', JSON.stringify(colab)); } catch (e) {} }

/* ---------- abas ---------- */
function aba(n) {
  $('painel-jogo').classList.toggle('on', n === 'jogo');
  $('painel-rank').classList.toggle('on', n === 'rank');
  $('aba-jogo').classList.toggle('on', n === 'jogo');
  $('aba-rank').classList.toggle('on', n === 'rank');
  if (n === 'rank') carregarRanking();
}
$('aba-jogo').onclick = () => aba('jogo');
$('aba-rank').onclick = () => aba('rank');
$('btn-colab').onclick = () => {
  $('entrada').classList.add('sai');
  aba(colab && colab.nome ? 'rank' : 'jogo');
};

/* ---------- ranking ---------- */
async function carregarRanking() {
  const ol = $('lista');
  try {
    const r = await (await fetch(API)).json();
    ol.innerHTML = '';
    if (!r.top.length) ol.innerHTML = '<p class="vazio">Ninguém jogou ainda. Seja o primeiro!</p>';
    r.top.forEach((j, i) => {
      const li = document.createElement('li');
      if (colab && colab.nome === j.nome && colab.pontos === j.pontos) li.className = 'eu';
      const b = document.createElement('b'); b.textContent = i + 1;
      const n = document.createElement('div'); n.textContent = j.nome;
      const s = document.createElement('span'); s.textContent = j.pontos + ' lixos';
      li.append(b, n, s); ol.append(li);
    });
  } catch (e) { ol.innerHTML = '<p class="vazio">Não foi possível carregar o ranking.</p>'; }
  const m = $('meu');
  if (colab && colab.nome) { m.hidden = false; m.textContent = 'Sua pontuação: ' + colab.pontos + ' lixos'; }
}

/* ---------- estado do jogador ---------- */
function atualizarJogo() {
  const salvo = !!(colab && colab.nome);
  $('cena').hidden = salvo;
  $('fim').hidden = !(colab && !colab.nome);
  $('jogado').hidden = !salvo;
  if (colab && !colab.nome) $('fim-pts').textContent = colab.pontos;
  if (colab && colab.nome) $('jogado').textContent = 'Você já jogou. Sua pontuação: ' + colab.pontos + ' lixos.';
}
$('salvar').onclick = async () => {
  const nome = $('nome').value.trim();
  if (!nome) { $('erro').textContent = 'Escreva um apelido.'; return; }
  $('salvar').disabled = true;
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: colab.id, nome, pontos: colab.pontos }) });
    if (!r.ok && r.status !== 409) throw 0;
    colab.nome = nome; guardar(); atualizarJogo(); aba('rank');
  } catch (e) { $('erro').textContent = 'Não deu para salvar. Tente de novo.'; }
  $('salvar').disabled = false;
};

/* ---------- jogo ---------- */
const cv = $('cv'), cx = cv.getContext('2d');
const W = 360, H = 200, G = 160;
cv.width = W * 2; cv.height = H * 2; cx.scale(2, 2);
let anim = 0, ac;
function audio() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {}
  return ac;
}
function somComer() {
  const a = audio(); if (!a) return;
  try {
    const t = a.currentTime;
    [[0, 420, 150], [0.11, 520, 170]].forEach(([d, f1, f2]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f1, t + d); o.frequency.exponentialRampToValueAtTime(f2, t + d + 0.09);
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.3, t + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.1);
      o.connect(g).connect(a.destination); o.start(t + d); o.stop(t + d + 0.11);
    });
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * 0.2), a.sampleRate), dd = buf.getChannelData(0);
    for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / dd.length);
    const sr = a.createBufferSource(), fl = a.createBiquadFilter(), gn = a.createGain();
    sr.buffer = buf; fl.type = 'bandpass'; fl.frequency.value = 1800; gn.gain.value = 0.25;
    sr.connect(fl).connect(gn).connect(a.destination); sr.start(t);
    const o2 = a.createOscillator(), g2 = a.createGain();
    o2.type = 'sine'; o2.frequency.setValueAtTime(180, t + 0.24); o2.frequency.exponentialRampToValueAtTime(420, t + 0.34);
    g2.gain.setValueAtTime(0.0001, t + 0.24); g2.gain.exponentialRampToValueAtTime(0.3, t + 0.26); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
    o2.connect(g2).connect(a.destination); o2.start(t + 0.24); o2.stop(t + 0.37);
  } catch (e) {}
}
function mascote(c, x, y, s, a, est) {
  c.save(); c.translate(x, y); c.scale(s, s); c.lineCap = 'round';
  const az = '#3b5a9a', az2 = '#2c4378', ci = '#3fd0e0', k = Math.sin(a);
  c.strokeStyle = az2; c.lineWidth = 3.5; c.beginPath();
  if (est === 'pula') { c.moveTo(17, 36); c.lineTo(14, 41); c.moveTo(28, 36); c.lineTo(31, 41); }
  else if (est === 'corre') { c.moveTo(17, 36); c.lineTo(17 + k * 6, 43 - Math.max(0, -k) * 4); c.moveTo(28, 36); c.lineTo(28 - k * 6, 43 - Math.max(0, k) * 4); }
  else { c.moveTo(17, 36); c.lineTo(17, 43); c.moveTo(28, 36); c.lineTo(28, 43); }
  c.stroke();
  c.strokeStyle = az; c.lineWidth = 2.5; c.beginPath();
  if (est === 'pula') { c.moveTo(10, 20); c.lineTo(3, 10); c.moveTo(34, 20); c.lineTo(41, 10); }
  else if (est === 'corre') { c.moveTo(10, 20); c.lineTo(4, 26 + k * 5); c.moveTo(34, 20); c.lineTo(40, 26 - k * 5); }
  else if (est === 'triste') { c.moveTo(10, 22); c.lineTo(5, 34); c.moveTo(34, 22); c.lineTo(39, 34); }
  else { c.moveTo(10, 20); c.lineTo(3, 10 + k * 3); c.moveTo(34, 22); c.lineTo(41, 40); }
  c.stroke();
  c.fillStyle = az; c.beginPath(); c.roundRect(10, 10, 24, 26, 3); c.fill();
  c.fillStyle = az2; c.beginPath(); c.roundRect(22, 10, 12, 26, [0, 3, 3, 0]); c.fill();
  c.fillStyle = ci; c.beginPath(); c.roundRect(13, 15, 18, 9, 4); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(18.5, 19.5, 2.6, 0, 7); c.fill();
  c.beginPath(); c.arc(25.5, 19.5, 2.6, 0, 7); c.fill();
  c.fillStyle = '#1f2a44'; c.beginPath(); c.arc(18.5, 19.8, 1.1, 0, 7); c.fill();
  c.beginPath(); c.arc(25.5, 19.8, 1.1, 0, 7); c.fill();
  c.strokeStyle = ci; c.lineWidth = 1.6; c.beginPath();
  if (est === 'triste') {
    c.arc(22, 32, 4, 1.2 * Math.PI, 1.8 * Math.PI); c.stroke();
    c.fillStyle = ci; c.beginPath(); c.arc(17.5, 27, 1.4, 0, 7); c.fill();
  } else { c.arc(22, 28, 4, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke(); }
  c.fillStyle = '#ef5b3b'; c.beginPath(); c.moveTo(10, 10); c.lineTo(12, 1); c.lineTo(17, 8); c.lineTo(22, -1); c.lineTo(27, 8); c.lineTo(32, 1); c.lineTo(34, 10); c.closePath(); c.fill();
  c.restore();
}
const cores = ['#B7A6E8', '#F2A9A0', '#8FC7B0', '#F0C987'];
let est = 'parado', p, obs, lix, vel, pts, prox, off = 0, last = 0;

function reset() { p = { y: G - 44, vy: 0, no: true }; obs = []; lix = []; vel = 3.4; pts = 0; prox = 80; }
function pular() {
  if (colab || !$('painel-jogo').classList.contains('on')) return;
  if (est === 'parado') iniciar();
  if (est === 'jogando' && p.no) { p.vy = -9.2; p.no = false; }
}
function iniciar() { audio(); reset(); est = 'jogando'; $('dica').style.display = 'none'; last = performance.now(); requestAnimationFrame(loop); }

function loop(n) {
  const dt = Math.min(2, (n - last) / 16.67); last = n;
  const d = Math.min(1, pts / 25);
  vel = Math.min(8, 3.2 + pts * 0.07); anim += vel * dt * 0.09;
  p.vy += 0.55 * dt; p.y += p.vy * dt;
  if (p.y >= G - 44) { p.y = G - 44; p.vy = 0; p.no = true; }
  prox -= vel * dt;
  if (prox <= 0) {
    const h = 40 + Math.floor(Math.random() * 14);
    obs.push({ x: W + 10, h, c: cores[Math.floor(Math.random() * cores.length)] });
    const gap = 200 - 50 * d + Math.random() * (100 - 30 * d);
    [0.3, 0.7].forEach(f => lix.push({ x: W + 10 + gap * f, y: G - 18 - Math.random() * (25 + 50 * d), t: Math.floor(Math.random() * 3) }));
    prox = gap;
  }
  obs.forEach(o => o.x -= vel * dt); lix.forEach(l => l.x -= vel * dt);
  obs = obs.filter(o => o.x > -30); lix = lix.filter(l => l.x > -20);
  off = (off + vel * dt) % 24;
  const px = 46, pw = 30, py = p.y + 6, ph = 34;
  for (const o of obs) {
    if (px + pw > o.x + 3 && px < o.x + 19 && py + ph > G - o.h + 6) return fim();
  }
  lix = lix.filter(l => {
    const r = 15 - 5 * d;
    const pego = px + pw > l.x - r && px < l.x + r && py + ph > l.y - r && py < l.y + r;
    if (pego) { pts++; somComer(); }
    return !pego;
  });
  desenhar();
  requestAnimationFrame(loop);
}

function fim() {
  est = 'fim'; desenhar();
  const id = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  colab = { id, pontos: pts, nome: null }; guardar(); atualizarJogo();
}

function desenhar() {
  cx.fillStyle = '#E6F0FB'; cx.fillRect(0, 0, W, H);
  cx.fillStyle = '#CDE8DA'; cx.fillRect(0, G, W, H - G);
  cx.fillStyle = '#B5D8C5';
  for (let x = -off; x < W; x += 24) cx.fillRect(x, G + 14, 10, 3);
  for (const l of lix) {
    cx.fillStyle = ['#9AA0B8', '#7FB7D6', '#F0D060'][l.t];
    cx.beginPath();
    if (l.t === 1) cx.roundRect(l.x - 6, l.y - 8, 12, 16, 3); else cx.arc(l.x, l.y, 8, 0, 7);
    cx.fill();
  }
  for (const o of obs) {
    const y = G - o.h;
    cx.fillStyle = o.c; cx.beginPath(); cx.roundRect(o.x, y + 12, 22, o.h - 22, 6); cx.fill();
    cx.fillStyle = '#F3C9A8'; cx.beginPath(); cx.arc(o.x + 11, y + 7, 7, 0, 7); cx.fill();
    cx.fillStyle = '#5B5875'; cx.fillRect(o.x + 3, G - 10, 6, 10); cx.fillRect(o.x + 13, G - 10, 6, 10);
  }
  mascote(cx, 40, p.y, 1, anim, p.no ? 'corre' : 'pula');
  cx.fillStyle = '#3A3752'; cx.font = '800 16px Nunito, sans-serif'; cx.fillText('Lixos: ' + pts, 12, 24);
}

cv.addEventListener('pointerdown', pular);
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); pular(); } });
const pc = $('pose').getContext('2d'); let tp = 0;
(function animaPose() {
  if ($('entrada').classList.contains('sai')) return;
  tp += 0.08; pc.clearRect(0, 0, 190, 200); mascote(pc, 20, 14, 3.4, tp, 'aponta');
  requestAnimationFrame(animaPose);
})();
mascote($('triste').getContext('2d'), 6, 5, 1.9, 0, 'triste');
reset(); desenhar(); atualizarJogo();
if (colab) $('dica').style.display = 'none';
</script>
</body>
</html>
